name: Refresh Pluto playlist

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-pluto-playlist
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate pluto.m3u with fresh token
        run: python3 pluto_m3u.py

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pluto.m3u

          if git diff --cached --quiet; then
            echo "No changes to pluto.m3u"
            exit 0
          fi

          git commit -m "ci: refresh pluto token and playlist"

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi

            echo "Push attempt $attempt failed; retrying..."
            sleep 10
          done

          exit 1

